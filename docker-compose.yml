services:
  postgres:
    image: postgres:17
    container_name: syncspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncspace
      POSTGRES_PASSWORD: syncspace
      POSTGRES_DB: syncspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
