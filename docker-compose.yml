services:
  postgres:
    image: postgres:17
    container_name: zeal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zeal
      POSTGRES_USER: zeal
      POSTGRES_PASSWORD: zeal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeal -d zeal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: zeal-backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: zeal-development-secret-key-change-me
      DJANGO_DEBUG: "True"
      POSTGRES_DB: zeal
      POSTGRES_USER: zeal
      POSTGRES_PASSWORD: zeal
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./apps/web
    container_name: zeal-frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:8000
    volumes:
      - ./apps/web:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  postgres_data:
  frontend_node_modules: