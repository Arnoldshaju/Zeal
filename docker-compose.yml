services:
  postgres:
    image: postgres:17
    container_name: zeal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeal
      POSTGRES_PASSWORD: zeal
      POSTGRES_DB: zeal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
